<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fall Fitness Challenge</title>
<script src="https://unpkg.com/mqtt@5.10.3/dist/mqtt.min.js"></script>
<script>if(typeof mqtt==='undefined'){document.write('<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.3/dist/mqtt.min.js"><\/script>')}</script>
<style>
  :root{
    --bg:#0c1017; --bg2:#111826; --card:#161e2c; --card2:#1c2536;
    --line:#26314a; --text:#eef2f8; --muted:#8d99ae;
    --accent:#c6f24e; --accent-dim:#9dc22e; --gold:#ffd166;
    --danger:#ff6b6b; --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, #1a2440 0%, var(--bg) 60%) fixed, var(--bg);
    color:var(--text); min-height:100vh; padding-bottom:110px;
  }
  header{
    position:sticky; top:0; z-index:20;
    background:rgba(12,16,23,.88); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line); padding:14px 16px 10px;
  }
  header h1{margin:0; font-size:20px; letter-spacing:.3px;}
  header h1 .trophy{margin-right:6px;}
  .sub{color:var(--muted); font-size:13px; margin-top:4px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .pill{background:var(--card2); border:1px solid var(--line); border-radius:999px; padding:3px 10px; font-size:12px; color:var(--text);}
  .pill.hot{background:rgba(198,242,78,.14); border-color:var(--accent-dim); color:var(--accent); font-weight:600;}
  nav.tabs{
    position:sticky; top:79px; z-index:19; display:flex; gap:8px;
    padding:10px 16px; background:rgba(12,16,23,.88); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  nav.tabs button{
    flex:1; border:1px solid var(--line); background:var(--card); color:var(--muted);
    border-radius:12px; padding:10px 0; font-size:14px; font-weight:600; cursor:pointer;
  }
  nav.tabs button.active{background:var(--accent); color:#10160a; border-color:var(--accent);}
  main{padding:16px; max-width:760px; margin:0 auto;}
  section.view{display:none;} section.view.active{display:block; animation:fade .18s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  /* Leaderboard */
  .card{
    background:linear-gradient(180deg,var(--card2),var(--card));
    border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:12px; display:flex; gap:12px; align-items:center;
  }
  .card.first{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold), 0 8px 30px rgba(255,209,102,.12);}
  .rank{font-size:22px; width:30px; text-align:center; flex:none;}
  .dot{width:12px; height:12px; border-radius:50%; flex:none;}
  .who{flex:1; min-width:0;}
  .who .name{font-weight:700; font-size:17px;}
  .who .meta{color:var(--muted); font-size:12.5px; margin-top:2px;}
  .pts{text-align:right; flex:none;}
  .pts .n{font-size:24px; font-weight:800; color:var(--accent);}
  .card.first .pts .n{color:var(--gold);}
  .pts .lbl{font-size:11px; color:var(--muted);}
  .bar{height:6px; background:#0a0e15; border-radius:99px; margin-top:8px; overflow:hidden;}
  .bar i{display:block; height:100%; background:var(--accent); border-radius:99px;}
  .bonus-note{font-size:12px; color:var(--muted); margin-top:6px;}
  .bonus-note b{color:var(--accent);}

  /* Weeks table */
  .tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--card);}
  table{border-collapse:collapse; width:100%; min-width:640px; font-size:13px;}
  th,td{padding:9px 8px; text-align:center; border-bottom:1px solid var(--line); white-space:nowrap;}
  th{background:var(--card2); color:var(--muted); font-weight:600; font-size:11.5px;}
  th.cur, td.cur{background:rgba(198,242,78,.07);}
  td.name,th.name{position:sticky; left:0; background:var(--card2); text-align:left; padding-left:12px; font-weight:700; z-index:2;}
  td .c{font-weight:700; font-size:15px;}
  td .p{font-size:11px; color:var(--muted);}
  td .star{color:var(--gold);}
  tfoot td{font-weight:800; background:var(--card2);}
  .legend{color:var(--muted); font-size:12px; margin-top:8px;}
  .legend .star{color:var(--gold);}

  /* Feed */
  .feed-item{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:10px; display:flex; gap:12px; align-items:flex-start;
  }
  .ico{font-size:26px; flex:none; width:44px; height:44px; display:flex; align-items:center; justify-content:center;
    background:var(--card2); border-radius:12px;}
  .fi-body{flex:1; min-width:0;}
  .fi-top{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .fi-name{font-weight:700; font-size:14.5px;}
  .fi-date{color:var(--muted); font-size:12px; margin-left:auto;}
  .fi-what{font-size:14px; margin-top:2px;}
  .fi-note{color:var(--muted); font-size:13px; margin-top:3px; font-style:italic;}
  .del{border:none; background:none; color:var(--muted); font-size:16px; cursor:pointer; padding:4px;}
  .edit{border:none; background:none; color:var(--muted); font-size:15px; cursor:pointer; padding:4px;}
  .edit:active,.del:active{color:var(--text);}
  .empty{text-align:center; color:var(--muted); padding:36px 16px; border:1px dashed var(--line); border-radius:var(--radius);}

  /* FAB + modal */
  .fab{
    position:fixed; right:18px; bottom:calc(20px + env(safe-area-inset-bottom)); z-index:30;
    width:64px; height:64px; border-radius:50%; border:none; cursor:pointer;
    background:var(--accent); color:#10160a; font-size:34px; font-weight:300; line-height:1;
    box-shadow:0 10px 30px rgba(198,242,78,.35);
  }
  .fab:active{transform:scale(.94);}
  .sheet-bg{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:40; display:none;}
  .sheet-bg.open{display:block;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:41; max-width:760px; margin:0 auto;
    background:var(--bg2); border:1px solid var(--line); border-bottom:none;
    border-radius:20px 20px 0 0; padding:18px 18px calc(22px + env(safe-area-inset-bottom));
    transform:translateY(105%); transition:transform .25s ease; max-height:92vh; overflow-y:auto;
  }
  .sheet.open{transform:none;}
  .sheet h2{margin:0 0 4px; font-size:18px;}
  .sheet .hint{color:var(--muted); font-size:13px; margin-bottom:14px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 14px;}
  .chips button{
    border:1px solid var(--line); background:var(--card); color:var(--text);
    border-radius:999px; padding:9px 14px; font-size:14px; cursor:pointer;
  }
  .chips button.sel{background:var(--accent); color:#10160a; border-color:var(--accent); font-weight:700;}
  label.f{display:block; font-size:13px; color:var(--muted); margin:12px 0 6px; font-weight:600;}
  input[type=text],input[type=date],input[type=number],textarea{
    width:100%; background:var(--card); border:1px solid var(--line); color:var(--text);
    border-radius:12px; padding:12px; font-size:15px; font-family:inherit;
  }
  textarea{resize:vertical; min-height:56px;}
  .row2{display:flex; gap:10px;} .row2>div{flex:1;}
  .btn{
    width:100%; border:none; border-radius:14px; padding:15px; font-size:16px; font-weight:800;
    background:var(--accent); color:#10160a; cursor:pointer; margin-top:16px;
  }
  .btn.ghost{background:var(--card); color:var(--text); border:1px solid var(--line); font-weight:600; margin-top:10px;}
